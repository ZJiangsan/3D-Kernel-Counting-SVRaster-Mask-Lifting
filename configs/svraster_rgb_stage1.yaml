# RGB-only SVRaster Stage-1 configuration used by the final pipeline.
#
# This is intentionally a minimal override file derived from the actual
# manuscript training script. It should be applied on top of the official
# NVlabs/SVRaster defaults for the corresponding code version.
#
# The later experimental mask-image fine-tuning stage is NOT part of the
# final proposed method and is therefore not included here.

bounding:
  bound_scale: 0.85

data:
  # Replace with the directory for one maize-ear dataset.
  source_path: /path/to/maize_ear_dataset
  image_dir_name: images
  mask_dir_name: masks
  res_downscale: 1.0

procedure:
  n_iter: 20000

regularizer:
  # The final geometry is reconstructed from RGB images only.
  # Kernel masks are applied later by post-hoc mask lifting.
  lambda_mask: 0.0
